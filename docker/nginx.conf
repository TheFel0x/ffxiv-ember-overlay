server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	charset utf-8;

	gzip on;
	gzip_vary on;
	gzip_min_length 256;
	gzip_types
		text/plain
		text/css
		text/javascript
		application/javascript
		application/json
		application/xml
		image/svg+xml
		text/markdown;

	location ~* \.md$ {
		default_type text/plain;
	}

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
